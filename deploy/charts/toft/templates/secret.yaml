{{- include "toft.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "toft.secretName" . }}
{{/*
Read the live Secret back and reuse what is already there.

ENCRYPTION_KEY is the only thing that can decrypt this install's app secrets and
git tokens, and JWT_SECRET is what every live session is signed with. Rolling
either on a routine `helm upgrade` does not fail loudly: it logs everyone out
and makes every stored secret undecryptable, and the install keeps running.

`lookup` returns nothing under `helm template` and `--dry-run`, so a rendered
manifest shows freshly generated values. That output must never be applied to a
live install — which is what secrets.existingSecret is for in any environment
where the data matters.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{/*
Both of these are read by hex.DecodeString and must be exactly 64 hex
characters — 32 bytes. randAlphaNum would produce a value that parses as neither
and fails at startup, so the generator is sha256sum, whose output is hex by
construction and exactly the right width.
*/}}
{{- $jwt := (get $data "JWT_SECRET") | default (sha256sum (randAlphaNum 64) | b64enc) }}
{{- $enc := (get $data "ENCRYPTION_KEY") | default (sha256sum (randAlphaNum 64) | b64enc) }}
{{/* Alphanumeric on purpose: this one is interpolated into a URL. */}}
{{- $pgpassB64 := (get $data "POSTGRES_PASSWORD") | default (randAlphaNum 32 | b64enc) }}
{{- $pgpass := b64dec $pgpassB64 }}
{{- $dbURL := (get $data "DATABASE_URL") | default (printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.username $pgpass (include "toft.postgresName" .) .Values.postgres.database | b64enc) }}
{{/*
The built-in administrator's first password.

Generated here rather than by the server so that it is READABLE AFTERWARDS:
`kubectl get secret` is how an operator who did not write it down gets back in,
and it is the one recovery route that needs no shell in the pod.

Reused like the others — regenerating it on a routine upgrade would be
meaningless anyway (the server only consults it when the account has no
password) but would leave the Secret advertising a credential that does not
work, which is worse than absent.
*/}}
{{- $adminPW := (get $data "BOOTSTRAP_ADMIN_PASSWORD") | default (randAlphaNum 24 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toft.labels" . | nindent 4 }}
  {{- if .Values.secrets.retainOnUninstall }}
  annotations:
    # Survives `helm uninstall`. Off by default: on a cluster meant to be
    # destroyed this is a leftover, and there is nothing left to decrypt.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  JWT_SECRET: {{ $jwt }}
  ENCRYPTION_KEY: {{ $enc }}
  {{- if .Values.builtinAdmin.generateBootstrapPassword }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPW }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgpassB64 }}
  DATABASE_URL: {{ $dbURL }}
  {{- end }}
  {{- if .Values.auth.github.enabled }}
  GITHUB_CLIENT_SECRET: {{ required "auth.github.enabled requires a client secret in .Values.auth.github.clientSecret (or use secrets.existingSecret)" .Values.auth.github.clientSecret | b64enc }}
  {{- end }}
  {{- if .Values.auth.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ required "auth.oidc.enabled requires a client secret in .Values.auth.oidc.clientSecret (or use secrets.existingSecret)" .Values.auth.oidc.clientSecret | b64enc }}
  {{- end }}
{{- end }}
